[package]
name = "worldgraph-stream"
description = "Versioned, authorized realtime delta streaming for WorldGraph"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
server = ["dep:axum", "dep:futures-util", "dep:jsonwebtoken", "dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wifi-densepose-worldgraph = { path = "../wifi-densepose-worldgraph", version = "0.3.2" }
wifi-densepose-geo = { path = "../wifi-densepose-geo", version = "0.1.0", default-features = false }
axum = { version = "0.8", features = ["ws"], optional = true }
futures-util = { version = "0.3", optional = true }
jsonwebtoken = { version = "9", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "worldgraph-stream-server"
path = "src/bin/server.rs"
required-features = ["server"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
