services:
  worldgraph-stream:
    build:
      context: .
      target: runtime
    image: worldgraph-stream:local
    environment:
      WORLDGRAPH_BIND: 0.0.0.0:8080
      # Empty by default; the server fails closed at startup unless production
      # supplies a >=32-byte secret or the explicit demo overlay replaces it.
      WORLDGRAPH_TOKEN_SECRET: ${WORLDGRAPH_TOKEN_SECRET:-}
      WORLDGRAPH_TOKEN_AUDIENCE: ${WORLDGRAPH_TOKEN_AUDIENCE:-worldgraph-stream}
      WORLDGRAPH_DEMO_MODE: ${WORLDGRAPH_DEMO_MODE:-0}
    ports:
      - "${WORLDGRAPH_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
