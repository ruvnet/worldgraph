name: PAN2 Vast CPU validation
on:
  pull_request:
    paths: ['tools/pan2-vast/**', '.github/workflows/pan2-vast.yml']
  push:
    branches: [main]
    paths: ['tools/pan2-vast/**', '.github/workflows/pan2-vast.yml']
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/pan2-vast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies only
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q pan2kit tests prepare_models.py make_patch.py
          bash -n bootstrap.sh
      - name: Test quantization, packed reload and evaluation orchestration
        run: python -m unittest discover -s tests -v
