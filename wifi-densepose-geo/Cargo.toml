[package]
name = "wifi-densepose-geo"
version = "0.1.0"
edition = "2021"
description = "Geospatial satellite integration — free satellite tiles, DEM, OSM, temporal tracking"
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false, optional = true }
chrono = { version = "0.4", optional = true }

[features]
default = ["network"]
network = ["dep:serde_json", "dep:tokio", "dep:anyhow", "dep:reqwest", "dep:chrono"]
